[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gbrain-code"
version = "0.1.0"
description = "Selective, diff-aware repository cartography for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Nicolas Cenci"}]
keywords = ["coding-agents", "code-graph", "mcp", "repository-map", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/spacerocket3/gbrain-code"
Documentation = "https://github.com/spacerocket3/gbrain-code/tree/main/docs"
Issues = "https://github.com/spacerocket3/gbrain-code/issues"

[project.optional-dependencies]
semantic = ["fastembed==0.8.0", "numpy==2.5.2"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.12"]

[project.scripts]
gbrain-code = "cli:main"
gbrain-code-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = [
  "cartographer",
  "cli",
  "graph_index",
  "mcp_server",
  "project_registry",
  "repository",
  "vector_search",
]

[tool.setuptools.data-files]
"share/gbrain-code" = ["ts_structure.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
